services:
  stats-db:
    image: postgres:16.1
    container_name: postgres-ewm-stats-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: stats
      POSTGRES_USER: stats
      POSTGRES_PASSWORD: stats
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stats"]
      interval: 5s
      retries: 5

  event-db:
    image: postgres:16.1
    container_name: postgres-ewm-event-db
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: event
      POSTGRES_USER: event
      POSTGRES_PASSWORD: event
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stats" ]
      interval: 5s
      retries: 5

  comment-db:
    image: postgres:16.1
    container_name: postgres-ewm-comment-db
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: comment
      POSTGRES_USER: comment
      POSTGRES_PASSWORD: comment
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stats" ]
      interval: 5s
      retries: 5

  request-db:
    image: postgres:16.1
    container_name: postgres-ewm-request-db
    ports:
      - "5435:5432"
    environment:
      POSTGRES_DB: request
      POSTGRES_USER: request
      POSTGRES_PASSWORD: request
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stats" ]
      interval: 5s
      retries: 5

  user-db:
    image: postgres:16.1
    container_name: postgres-ewm-user-db
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: user
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U stats" ]
      interval: 5s
      retries: 5