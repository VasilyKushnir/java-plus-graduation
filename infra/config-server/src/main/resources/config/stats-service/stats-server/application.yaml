server:
  port: 0

spring:
  sql:
    init:
      mode: always

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/stats
    username: stats
    password: stats

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    hibernate:
      ddl-auto: none

    properties:
      hibernate:
        format_sql: true

    open-in-view: false
    show-sql: true

management:
  endpoints:
    web:
      exposure:
        include: "*"